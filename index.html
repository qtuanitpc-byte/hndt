<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Tra cứu số thứ tự doanh nghiệp</title>
    <style>
      :root {
        --bg: #f3f6fb;
        --card: #fff;
        --text: #152033;
        --muted: #667085;
        --line: #e4e7ec;
        --brand: #0b63ce;
        --brand2: #eaf3ff;
        --ok: #087443;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: Arial, "Segoe UI", sans-serif;
        background: linear-gradient(135deg, #edf4ff, #f8fafc);
        color: var(--text);
      }
      .wrap {
        max-width: 920px;
        margin: 0 auto;
        padding: 32px 16px 56px;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 20px;
        box-shadow: 0 16px 40px rgba(16, 24, 40, 0.08);
        overflow: hidden;
      }
      .hero {
        padding: 28px 28px 20px;
        background: linear-gradient(120deg, #075bbd, #1683e8);
        color: #fff;
      }
      h1 {
        font-size: clamp(24px, 4vw, 36px);
        margin: 0 0 8px;
      }
      .hero p {
        margin: 0;
        opacity: 0.92;
        line-height: 1.5;
      }
      .search {
        padding: 24px 28px 16px;
      }
      label {
        display: block;
        font-weight: 700;
        margin-bottom: 8px;
      }
      .input-wrap {
        position: relative;
      }
      input {
        width: 100%;
        font-size: 18px;
        padding: 15px 48px 15px 16px;
        border: 2px solid #cfd7e6;
        border-radius: 12px;
        outline: none;
      }
      input:focus {
        border-color: var(--brand);
        box-shadow: 0 0 0 4px rgba(11, 99, 206, 0.12);
      }
      #clear {
        position: absolute;
        right: 9px;
        top: 50%;
        transform: translateY(-50%);
        border: 0;
        background: #eef2f6;
        border-radius: 8px;
        width: 34px;
        height: 34px;
        font-size: 20px;
        cursor: pointer;
        color: #475467;
      }
      .hint {
        font-size: 14px;
        color: var(--muted);
        margin: 8px 2px 0;
      }
      .status {
        padding: 0 28px 12px;
        color: var(--muted);
        min-height: 22px;
      }
      .results {
        padding: 0 28px 28px;
        display: grid;
        gap: 10px;
      }
      .item {
        display: grid;
        grid-template-columns: 82px 1fr;
        gap: 14px;
        align-items: center;
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 14px;
        background: #fff;
      }

      .item.to-mau {
        font-weight: bold;
        font-style: italic;
        background: #fff3b0;
        border: 2px solid #f59e0b;
        box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.16);
      }
      .item.to-mau .num { background: #f59e0b; color: #fff; }
      .item.to-mau .name { color: #b45309; }
      .num {
        background: var(--brand2);
        color: var(--brand);
        font-size: 24px;
        font-weight: 800;
        text-align: center;
        padding: 12px 8px;
        border-radius: 10px;
      }
      .num small {
        display: block;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        margin-bottom: 2px;
      }
      .name {
        font-weight: 800;
        line-height: 1.35;
      }
      .full {
        font-size: 14px;
        color: var(--muted);
        margin-top: 4px;
        line-height: 1.35;
      }
      .empty {
        padding: 28px;
        text-align: center;
        border: 1px dashed #cfd7e6;
        border-radius: 14px;
        color: var(--muted);
      }
      mark {
        background: #fff0a8;
        padding: 0 1px;
        border-radius: 2px;
      }
      footer {
        text-align: center;
        color: var(--muted);
        font-size: 13px;
        margin-top: 16px;
      }
      @media (max-width: 520px) {
        .hero,
        .search {
          padding-left: 18px;
          padding-right: 18px;
        }
        .status,
        .results {
          padding-left: 18px;
          padding-right: 18px;
        }
        .item {
          grid-template-columns: 66px 1fr;
        }
        .num {
          font-size: 21px;
        }
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0d1420;
          --card: #141d2b;
          --text: #f4f7fb;
          --muted: #aab4c3;
          --line: #2b3749;
          --brand2: #12345c;
        }
        body {
          background: #0d1420;
        }
        .card,
        .item {
          background: var(--card);
        }
        input {
          background: #0f1825;
          color: var(--text);
          border-color: #3a4860;
        }
        #clear {
          background: #293548;
          color: #e5e7eb;
        }
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <section class="card">
        <div class="hero">
          <h1 style="text-align: center; color: rgb(94, 255, 0); font-size: 40">
            Tra cứu số thứ tự doanh nghiệp 13.11.2026
          </h1>
          <p>
            Nhập tên đầy đủ hoặc một phần tên doanh nghiệp. Hệ thống hỗ trợ tìm
            kiếm không dấu.
          </p>
        </div>
        <div class="search">
          <label for="q">Tên doanh nghiệp</label>
          <div class="input-wrap">
            <input
              id="q"
              type="search"
              autocomplete="off"
              placeholder="Ví dụ: Becamex, An Phước, Việt Úc..."
              autofocus
            /><button id="clear" type="button" aria-label="Xóa nội dung">
              ×
            </button>
          </div>
          <p class="hint">Danh sách gồm 205 doanh nghiệp.</p>
        </div>
        <div id="status" class="status" aria-live="polite">
          Nhập ít nhất 1 ký tự để tìm kiếm.
        </div>
        <div id="results" class="results"></div>
      </section>
      <footer>ITPC - Phòng dịch vụ và hỗ trợ doanh nghiệp</footer>
    </main>
    <script>
      let DATA = [];
      async function loadData() {
        try {
          const r = await fetch("data.json");

          if (!r.ok) {
            throw new Error("Không tải được data.json");
          }

          DATA = await r.json();

          document.querySelector(".hint").textContent = `Danh sách gồm ${DATA.length} doanh nghiệp.`;
          console.log("Loaded:", DATA.length);
        } catch (err) {
          console.error(err);
          status.textContent = err.message;
        }
      }

      const q = document.getElementById("q"),
        results = document.getElementById("results"),
        status = document.getElementById("status"),
        clear = document.getElementById("clear");
      const norm = (s) =>
        (s || "")
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g, "")
          .replace(/đ/g, "d")
          .replace(/Đ/g, "D")
          .toLowerCase()
          .replace(/\s+/g, " ")
          .trim();
      const esc = (s) =>
        String(s).replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#039;",
            })[c],
        );
      function render() {
        const raw = q.value.trim(),
          needle = norm(raw);
        results.innerHTML = "";
        if (!needle) {
          status.textContent = "Nhập ít nhất 1 ký tự để tìm kiếm.";
          return;
        }
        const words = needle.split(" ").filter(Boolean);
        const found = DATA.filter((x) => {
          const searchText = norm(`${x.dayDu} ${x.ten}`);
          return words.every((w) => searchText.includes(w));
        }).slice(0, 60);
        status.textContent = found.length
          ? `Tìm thấy ${found.length} kết quả${found.length === 60 ? " đầu tiên" : ""}.`
          : "Không tìm thấy doanh nghiệp phù hợp.";
        if (!found.length) {
          results.innerHTML =
            '<div class="empty">Thử nhập tên ngắn hơn hoặc bỏ các từ như “Công ty”, “TNHH”, “Cổ phần”, hoặc doanh nghiệp không có trong danh sách </div>';
          return;
        }
        results.innerHTML = found
          .map(
            (x) =>
              `<article class="item${x.tomau || x.Tomau ? " to-mau" : ""}"><div class="num"><small>STT</small>${esc(x.stt)}</div><div><div class="name">${esc(x.dayDu)} ${esc(x.ten)}</div><div class="full">${esc(x.dayDu)} ${esc(x.ten)}</div></div></article>`,
          )
          .join("");
      }
      q.addEventListener("input", render);
      clear.addEventListener("click", () => {
        q.value = "";
        render();
        q.focus();
      });
      async function init() {
        status.textContent = "Đang tải dữ liệu...";
        await loadData();
        render();
      }
      init();
    </script>
  </body>
</html>
